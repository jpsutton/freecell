# Full build on pull requests into main: the package for every platform. The
# Linux AppImage is required for a release; the Windows and macOS builds are best
# effort (not required checks): a release ships them if they built. Nothing is
# signed here. release.yml takes the artifacts of the final PR head, signs them and
# publishes them without rebuilding.
# workflow_dispatch runs it on any branch, for testing the build itself.
name: build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# staging is the head of the staging -> main pull request, so every merge into
# staging pushes to it and starts a new full build. Only the newest head matters,
# so a push cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.1
  NDK_VERSION: 27.2.12479018   # the NDK Qt 6.10 is built with

jobs:
  # The oldest supported Ubuntu runner (24.04) sets the glibc the AppImage needs (2.39).
  linux-appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build tools and the libraries Qt's X11 and Wayland plugins load
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 >/dev/null
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFREECELL_UPDATER=ON
          cmake --build build
      - name: Logic tests
        run: ctest --test-dir build --output-on-failure
      - name: AppImage
        run: scripts/ci/package-linux.sh build dist
      - uses: actions/upload-artifact@v7
        with:
          name: freecell-linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The jpsutton pacman repository (jpsutton/arch-repo) republishes this package.
  # It builds against the current Arch libraries, so it needs no Qt install step.
  linux-arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Package
        run: scripts/ci/package-arch.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: freecell-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DFREECELL_UPDATER=ON
          cmake --build build
      - name: Logic tests
        run: ctest --test-dir build --output-on-failure
      - name: Zip
        run: scripts/ci/package-windows.sh build dist
      - uses: actions/upload-artifact@v7
        with:
          name: freecell-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Apple silicon only; Qt 6.10 needs macOS 13 or newer.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFREECELL_UPDATER=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build
      - name: Logic tests
        run: ctest --test-dir build --output-on-failure
      - name: Bundle
        run: scripts/ci/package-macos.sh build dist
      - uses: actions/upload-artifact@v7
        with:
          name: freecell-macos
          path: dist/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The arm64 APK, unsigned: release.yml signs it with the release key and adds it
  # to the F-Droid repository. Best effort, like Windows and macOS.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build tools and the Android SDK parts Qt needs
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ninja-build >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" >/dev/null
      # The desktop Qt supplies moc, rcc and androiddeployqt to the Android build.
      - uses: jurplel/install-qt-action@v4
        id: qt-host
        with:
          version: ${{ env.QT_VERSION }}
          dir: ${{ runner.temp }}/qt-host
          set-env: false
          cache: true
      - uses: jurplel/install-qt-action@v4
        id: qt-android
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/qt-android
          set-env: false
          cache: true
      - name: APK
        env:
          QT_HOST: ${{ runner.temp }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64
          QT_ANDROID: ${{ runner.temp }}/qt-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          UNSIGNED: 1   # release.yml signs it with the release key
        run: scripts/ci/package-android.sh build-android dist
      - uses: actions/upload-artifact@v7
        with:
          name: freecell-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
